services:
  dev:
    profiles: ["dev"]
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    env_file: .env.local
    environment:
      STORAGE_BACKEND: file
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  app:
    profiles: ["prod"]
    build: .
    ports:
      - "3000:3000"
    env_file: .env.local
    environment:
      STORAGE_BACKEND: file
    volumes:
      - ./data:/app/data

volumes:
  node_modules:
